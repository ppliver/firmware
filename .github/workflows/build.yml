name: build
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# NOTE (ppliver/firmware fork): this is a private mirror of OpenIPC/firmware
# carrying the SAZ1051 board. Upstream's own build.yml selects boards with
# .github/scripts/ci-matrix.py and, by design, skips PRs on clones
# (`github.event.repository.private`), so it never builds here. This file is the
# fork's focused replacement: one static matrix entry for saz1051 and an
# upload-artifact step (no release writes, no secrets needed).

jobs:
  buildroot:
    name: Firmware
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # SAZ1051 [Hi3516CV610 + OS05L10 + WS73] - 128MB SPI-NAND
          - {"platform": "saz1051", "release": "ultimate"}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "CACHE_DATE=$(date +%m)" >> ${GITHUB_ENV}
          # NOTE: `>> $GITHUB_ENV` only affects LATER steps, so export it here too.
          # Without this the download below lands in buildroot's default
          # $(O)/buildroot-*/dl while the build step (which does see the env var)
          # extracts from $(O)/dl -> stamps say "downloaded" but the tarball is
          # missing, and the build dies in host-pkgconf with "No such file".
          echo "BR2_DL_DIR=${GITHUB_WORKSPACE}/output/dl" >> ${GITHUB_ENV}
          export BR2_DL_DIR="${GITHUB_WORKSPACE}/output/dl"
          make BOARD=${{matrix.platform}}_${{matrix.release}} br-source

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ${{matrix.platform}}_${{matrix.release}}-${{env.CACHE_DATE}}

      - name: Build firmware
        run: |
          mkdir -p /tmp/ccache
          ln -s /tmp/ccache ${HOME}/.ccache
          make BOARD=${{matrix.platform}}_${{matrix.release}}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{matrix.platform}}-${{matrix.release}}
          # 128MB SPI-NAND board, so only the Makefile's NAND branch runs and it
          # emits exactly one file. Two paths listed here were phantoms and only
          # cost a "No files were found" warning per run: the -nor- tgz (no NOR
          # branch) and the tgz's own .md5sum (PREPARE_REPACK deletes
          # images/*.md5sum right before taring; the per-image checksums for
          # uImage/rootfs.ubi are *inside* the tgz).
          path: output/images/openipc.${{matrix.platform}}-nand-${{matrix.release}}.tgz
          if-no-files-found: error
