name: saz1051-build

# SAZ1051 (Hi3516CV610) dedicated build. Two jobs in one workflow:
#   * workflow_dispatch — build a specific commit (or HEAD of saz1051-sync) and
#     publish the NAND image as a GitHub Release.
#   * schedule (weekly) — a "keep the cache warm" heartbeat that is NOT tied to
#     any bug: the board is small but a COLD full rebuild is 30-60 min, which
#     both wastes runner minutes and leaves a long window for the hosted
#     runner's agent process to intermittently wedge (build logs freeze
#     mid-package, no error, disk has 80GB+ free). A weekly successful build
#     rewrites the ccache entry (we always save to a fresh run_id key) so the
#     cache never hits the 7-day eviction window. The next dispatch then
#     restores a HOT cache and finishes in ~10 min instead of ~60.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA on saz1051-sync to build (optional; defaults to HEAD).'
        required: false
  schedule:
    # Mondays 03:17 UTC — deliberately off the :00 rush.
    - cron: '17 3 * * 1'

jobs:
  build:
    name: SAZ1051 (${{ inputs.commit || 'HEAD' }})
    runs-on: ubuntu-22.04   # pinned: see note in build-one.yml about runner wedges

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Always build the SAZ1051 board tree. An explicit commit input
          # overrides; otherwise pin to saz1051-sync (the board defconfig and
          # vendor package only exist there, NOT on master). The earlier
          # `|| github.sha` fallback checked out master and either built the
          # wrong tree or failed `make BOARD=saz1051_ultimate`.
          ref: ${{ inputs.commit || 'saz1051-sync' }}
          fetch-depth: 0

      - name: Prepare
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo CACHE_DATE=$(date +%m) >> ${GITHUB_ENV}
          echo "BR2_DL_DIR=${GITHUB_WORKSPACE}/output/dl" >> ${GITHUB_ENV}

      # Restore the most recent ccache regardless of its age. GitHub evicts
      # entries after 7 days, but as long as SOME build succeeded within the
      # window its entry is still here, and the "Save ccache" step below writes
      # a fresh one on every success — so the eviction never actually bites us.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: saz1051-ccache-${{ github.run_id }}
          restore-keys: |
            saz1051-ccache-

      - name: Restore dl cache
        uses: actions/cache/restore@v4
        with:
          path: output/dl
          key: dl-${{ env.CACHE_DATE }}
          restore-keys: dl-

      # Keep the exact logic from build-one.yml: drop cached tarballs whose
      # filename is constant but whose CONTENT moves (dash/HEAD/master/main/
      # dist, plus the openipc/linux kernel archive whose filename is the
      # branch name). Otherwise buildroot silently ships a stale snapshot.
      - name: Refresh moving-ref package downloads
        run: |
          if [ -d "${BR2_DL_DIR}" ]; then
            find "${BR2_DL_DIR}" -type f -regextype posix-extended \
              -regex '.*[-.](HEAD|master|main|dist)\.tar\.(gz|bz2|xz)' \
              -print -delete
            if [ -d "${BR2_DL_DIR}/linux" ]; then
              find "${BR2_DL_DIR}/linux" -maxdepth 1 -type f -name '*.tar.gz' \
                -print -delete
            else
              echo "no kernel archive cached yet -- nothing to refresh."
            fi
          else
            echo "dl cache is cold (${BR2_DL_DIR} absent) -- nothing to refresh."
          fi

      - name: Build firmware
        run: |
          export GIT_HASH=$(git rev-parse --short HEAD)
          export GIT_BRANCH=saz1051-sync
          echo GIT_HASH=${GIT_HASH} >> ${GITHUB_ENV}
          echo GIT_BRANCH=${GIT_BRANCH} >> ${GITHUB_ENV}

          mkdir -p /tmp/ccache
          ln -s /tmp/ccache ${HOME}/.ccache
          # Bound the cache so a runaway build can never be what fills the disk.
          ccache -M 1G || true
          echo "disk before build:"; df -h / /tmp || true

          backoffs="30 60 120 300 600 1200"
          attempt=1
          for sleep_for in $backoffs ""; do
            # timeout guards against a wedged runner agent leaving make hanging
            # forever; -k 60 escalates to SIGKILL if children linger.
            timeout -k 60 7200 make BOARD=saz1051_ultimate && break
            if [ -z "$sleep_for" ]; then
              echo "::error::build failed after ${attempt} attempts"
              exit 1
            fi
            echo "::warning::attempt ${attempt} failed, retrying after ${sleep_for}s"
            df -h / /tmp || true
            sleep "$sleep_for"
            attempt=$((attempt + 1))
          done

          TIME=$(date -d @${SECONDS} +%M:%S)
          echo TIME=${TIME} >> ${GITHUB_ENV}
          NAND=$(find output/images -name 'openipc*nand*' | head -n1)
          echo "NAND image: ${NAND}"
          echo "NAND=${NAND}" >> ${GITHUB_ENV}
          echo "SHORT_SHA=${GIT_HASH}" >> ${GITHUB_ENV}

      # Always persist a FRESH ccache entry on success (run_id-keyed, so it
      # never collides and always resets the 7-day eviction clock).
      - name: Save ccache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: /tmp/ccache
          key: saz1051-ccache-${{ github.run_id }}

      # Only a manual build is an actual deliverable; a weekly heartbeat just
      # refreshes the cache and must not create Release tags.
      - name: Upload firmware (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-saz1051-${{ env.SHORT_SHA }}
          prerelease: true
          body: |
            board=saz1051_ultimate
            sha=${{ github.sha }}
            built=${{ env.SHORT_SHA }}
          files: |
            ${{ env.NAND }}