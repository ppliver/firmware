# Hisilicon NAND rootfs layout -- SquashFS-on-UBI.
#
# Two volumes:
#   rootfs       -- the read-only squashfs image. U-Boot/kernel expose it as a
#                   block device (/dev/ubiblock0_0); bootargs use
#                   `ubi.block=0,0 root=/dev/ubiblock0_0 rootfstype=squashfs ro`.
#                   Read-only means a power cut mid-boot cannot corrupt the root.
#   rootfs_data  -- persistent user data. OpenIPC's /init mounts it as a
#                   read-write /overlay on top of the read-only root, so /etc
#                   (majestic token, dropbear host key, WebUI settings) survives
#                   a reboot, and sysupgrade can preserve it across a rootfs
#                   update. autoresize grows it to fill the rest of the UBI
#                   partition on first attach.
#
# Taken from OpenIPC upstream branch `nand-sysupgrade-preserve`
# (general/scripts/ubifs/ubinize_hisilicon.cfg, commit 17da1738 "hisilicon NAND:
# switch rootfs to SquashFS-on-UBI"). Buildroot's fs/ubi/ubi.mk rewrites the
# BINARIES_DIR token to the real output dir before calling ubinize.
#
# NOTE: the rootfs volume must NOT be the old single writable UBIFS layout this
# board used to ship (one volume named "ubifs", bootargs root=ubi0:ubifs, mounted
# read-write and drifting to 100% full). The two-volume layout above replaces it.

[rootfs]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
vol_size=32MiB
image=BINARIES_DIR/rootfs.squashfs

[data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=2MiB
vol_flags=autoresize
