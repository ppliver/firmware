[ubifs]
mode=ubi
# buildroot substitutes BR2_ROOTFS_UBIFS_PATH with the absolute path to the
# built rootfs.ubifs (it applies this sed to custom configs too).
image=BR2_ROOTFS_UBIFS_PATH
vol_id=0
vol_type=dynamic
# Volume name MUST be "ubifs": the device bootargs mount root=ubi0:ubifs.
vol_name=ubifs
vol_alignment=1
# Autoresize fills the UBI partition on the device (mkfs.ubifs was built with
# -c 760, so the FS can grow up to ~96 MB if the partition is that large).
vol_flags=autoresize
